<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#bef264" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#20261a"/>
      <stop offset="100%" stop-color="#12140f"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>

  <rect
