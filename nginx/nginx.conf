events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript;

    client_max_body_size 30M;

    set_real_ip_from 172.19.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    log_format audit '$time_iso8601 remote_addr=$remote_addr cf_country=$http_cf_ipcountry '
                      'host=$host method=$request_method uri=$request_uri status=$status '
                      'bytes=$body_bytes_sent ua="$http_user_agent"';
    access_log /var/log/nginx-audit/audit.log audit;

    upstream core_api {
        server core-api:8080;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name tfg.viiceetee.dev;

        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            proxy_pass http://core_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        location /ws/ {
            proxy_pass http://core_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    include /etc/nginx/conf.d/apps/*.conf;

    server {
        listen 80 default_server;
        server_name _;

        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 404 "Not Found\n";
            add_header Content-Type text/plain;
        }
    }

}
