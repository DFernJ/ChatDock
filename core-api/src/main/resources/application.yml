spring:
  application:
    name: ChatDock

  task:
    scheduling:
      pool:
        size: 4

  datasource:
    url: jdbc:mysql://${MYSQL_IP}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL}
            temperature: 0

server:
  port: ${CORE_API_PORT}

app:
  public-url: ${APP_PUBLIC_URL}
  docker:
    connection-timeout-seconds: 10
    response-timeout-seconds: 60
    stats-wait-seconds: 5
    logs-wait-seconds: 30
    pull-image-timeout-seconds: 120
    apps-network-name: chatops-apps
    default-subdomain-port: 80
    reserved-subdomains: www,api,admin,mail,ftp,root,localhost
  dockerhub:
    search-page-size: 25
  import:
    image: chatops/importer:latest
    max-zip-bytes: 314572800
    sandbox-wait-seconds: 60
    build-timeout-seconds: 300
    image-build-timeout-seconds: 120
    sandbox-memory-bytes: 536870912
  ai:
    max-log-bytes: 10485760
  nginx:
    apps-conf-dir: /etc/nginx/conf.d/apps
    container-name: essential-chatdock-nginx
    max-body-size: 20m
    reload-timeout-seconds: 10
  oauth:
    github-state-cookie-ttl-minutes: 10
  discord:
    link-code-ttl-minutes: 10
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS}
    internal-token: ${INTERNAL_SECURITY_TOKEN}
    internal-token-header: X-Internal-Token
    cypher:
      encryption-key: ${SECRET_ENCRYPTION_KEY}
    cookie:
      secure: ${COOKIE_SECURE}
    cors:
      allow-origin: ${CORS_ALLOW_ORIGIN}
  bot-service:
    url: ${BOT_SERVICE_URL}
  github:
    client-id: ${GITHUB_APP_CLIENT_ID}
    client-secret: ${GITHUB_APP_CLIENT_SECRET}
    app-slug: ${GITHUB_APP_SLUG}
    app-id: ${GITHUB_APP_ID}
    private-key: ${GITHUB_APP_PRIVATE_KEY}
  # Dominio base de los subdominios de apps importadas (compatible con CLOUDFLARE_BASE_DOMAIN)
  base-domain: ${BASE_DOMAIN:${CLOUDFLARE_BASE_DOMAIN:}}
  # Dominio base alternativo servido por el edge directo (sin Cloudflare). Opcional.
  alt-base-domain: ${ALT_BASE_DOMAIN:}
  dns:
    # cloudflare: crea/borra un CNAME por app vía API de Cloudflare
    # none: sin gestión de DNS por app (usa un registro wildcard manual)
    provider: ${DNS_PROVIDER:cloudflare}
  cloudflare:
    api-token: ${CLOUDFLARE_API_TOKEN:}
    zone-id: ${CLOUDFLARE_ZONE_ID:}
    tunnel-id: ${CLOUDFLARE_TUNNEL_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "[%d{HH:mm:ss-dd/MM/yyyy}] - [%logger{0}] %msg%n"