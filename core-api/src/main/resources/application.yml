spring:
  application:
    name: DockerOps

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${CORE_API_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS}
    internal-token: ${INTERNAL_SECURITY_TOKEN}
    cypher:
      encryption-key: ${SECRET_ENCRYPTION_KEY}
  bot-service:
    url: ${BOT_SERVICE_URL}
  cloudflare:
    api-token: ${CLOUDFLARE_API_TOKEN}
    zone-id: ${CLOUDFLARE_ZONE_ID}
    tunnel-id: ${CLOUDFLARE_TUNNEL_ID}
    base-domain: ${CLOUDFLARE_BASE_DOMAIN}
  ai:
    api-key: ${AI_API_KEY}
    model: ${AI_MODEL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
