spring:
  application:
    name: DockerOps

  task:
    scheduling:
      pool:
        size: 4

  datasource:
    url: jdbc:mysql://${MYSQL_IP}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL}
            temperature: 0

server:
  port: ${CORE_API_PORT}

app:
  public-url: ${APP_PUBLIC_URL}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS}
    internal-token: ${INTERNAL_SECURITY_TOKEN}
    cypher:
      encryption-key: ${SECRET_ENCRYPTION_KEY}
    cookie:
      secure: ${COOKIE_SECURE}
    cors:
      allow-origin: ${CORS_ALLOW_ORIGIN}
  bot-service:
    url: ${BOT_SERVICE_URL}
  github:
    client-id: ${GITHUB_APP_CLIENT_ID}
    client-secret: ${GITHUB_APP_CLIENT_SECRET}
    app-slug: ${GITHUB_APP_SLUG}
    app-id: ${GITHUB_APP_ID}
    private-key: ${GITHUB_APP_PRIVATE_KEY}
  cloudflare:
    api-token: ${CLOUDFLARE_API_TOKEN}
    zone-id: ${CLOUDFLARE_ZONE_ID}
    tunnel-id: ${CLOUDFLARE_TUNNEL_ID}
    base-domain: ${CLOUDFLARE_BASE_DOMAIN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "[%d{HH:mm:ss-dd/MM/yyyy}] - [%logger{0}] %msg%n"